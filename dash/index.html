<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard catalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Raleway:wght@600;700&display=swap">
<link rel="stylesheet" href="dash.css">
</head>
<body>
<div class="bar" role="banner">
  <strong>Dashboard catalog</strong>
  <select id="page" class="pagepick" aria-label="Page"></select>
  <select id="persona" aria-label="Persona"></select>
  <select id="tier" aria-label="Tier"></select>
  <input id="q" type="search" placeholder="Search all charts" aria-label="Search all charts">
  <button id="pickedOnly" type="button" aria-pressed="false">Picked or noted</button>
  <span class="spacer"></span>
  <span id="copied" class="copied" aria-live="polite"></span>
  <button id="copyNotes" type="button">Copy notes</button>
  <button id="copy" type="button">Copy picks</button>
</div>
<main>
  <pre id="selftest"></pre>
  <div class="pagehead"><h1 id="title"></h1><p id="sub"></p><span id="count" class="count"></span></div>
  <div id="cards" class="cards"></div>
</main>

<script src="catalog.js"></script>
<script src="data.js"></script>
<script src="charts.js"></script>
<script src="pages/a-home.js" onerror="void 0"></script>
<script src="pages/b-leadership.js" onerror="void 0"></script>
<script src="pages/c-flow.js" onerror="void 0"></script>
<script src="pages/d-hours.js" onerror="void 0"></script>
<script src="pages/e-people.js" onerror="void 0"></script>
<script>
(function () {
  'use strict';
  const CAT = window.CATALOG || [], PAGES = window.PAGES || [];
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  /* pages in catalog order, with chart counts */
  const pages = [];
  CAT.forEach((r) => { let p = pages.find((x) => x.name === r.page); if (!p) pages.push(p = { name: r.page, ids: [] }); p.ids.push(r.id); });
  const ALIAS = { 'Eng manager home': 'Engineering manager home', 'WO page': 'WO page: job summary' };
  const info = (name) => PAGES.find((p) => p.page === name) || PAGES.find((p) => p.page === ALIAS[name]) || PAGES.find((p) => p.page.startsWith(name)) || {};
  const personas = [];
  CAT.forEach((r) => String(r.persona || '').split(/[,;]/).map((x) => x.replace(/\(.*?\)/g, '').trim()).filter(Boolean).forEach((x) => { if (!personas.includes(x)) personas.push(x); }));
  const tiers = [...new Set(CAT.map((r) => r.tier).filter(Boolean))];

  /* picks */
  const KEY = 'dash-catalog-picks';
  let picks = new Set();
  try { picks = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { picks = new Set(); }
  /* meeting notes, one per chart code */
  const NKEY = 'dash-catalog-notes';
  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(NKEY) || '{}') || {}; } catch (e) { notes = {}; }
  const saveNotes = () => { try { localStorage.setItem(NKEY, JSON.stringify(notes)); } catch (e) { /* storage unavailable */ } };
  const savePicks = () => { try { localStorage.setItem(KEY, JSON.stringify([...picks])); } catch (e) { /* storage unavailable */ } };

  /* state from the hash */
  const S = { page: pages[0] ? pages[0].name : '', persona: '', tier: '', q: '', picked: false };
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    const pg = h.get('page'); if (pg) { const m = pages.find((p) => p.name === pg) || pages.find((p) => p.name.toLowerCase() === pg.toLowerCase()); if (m) S.page = m.name; }
  }
  function writeHash() { if (selftest) return; const h = new URLSearchParams(); h.set('page', S.page); try { history.replaceState(null, '', '#' + h.toString().replace(/\+/g, '%20')); } catch (e) { /* file:// may refuse */ } }
  const selftest = /(^|[#&])selftest\b/.test(location.hash);
  readHash();

  /* top bar */
  const opt = (v, t) => { const o = el('option', null, t); o.value = v; return o; };
  pages.forEach((p) => $('page').appendChild(opt(p.name, `${p.name} (${p.ids.length})`)));
  $('persona').appendChild(opt('', 'All personas')); personas.forEach((p) => $('persona').appendChild(opt(p, p)));
  $('tier').appendChild(opt('', 'All tiers')); tiers.forEach((t) => $('tier').appendChild(opt(t, t)));
  $('page').value = S.page;
  $('page').addEventListener('change', () => { S.page = $('page').value; S.q = ''; $('q').value = ''; S.picked = false; syncPicked(); writeHash(); render(); window.scrollTo(0, 0); });
  $('persona').addEventListener('change', () => { S.persona = $('persona').value; render(); });
  $('tier').addEventListener('change', () => { S.tier = $('tier').value; render(); });
  let qt; $('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { S.q = $('q').value.trim(); render(); }, 180); });
  const syncPicked = () => $('pickedOnly').setAttribute('aria-pressed', String(S.picked));
  $('pickedOnly').addEventListener('click', () => { S.picked = !S.picked; syncPicked(); render(); });
  function copyText(text) {
    const fallback = () => { const t = el('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } t.remove(); return ok; };
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, fallback);
    return Promise.resolve(fallback());
  }
  $('copy').addEventListener('click', () => {
    const ids = CAT.map((r) => r.id).filter((id) => picks.has(id));
    if (!ids.length) { $('copied').textContent = 'Nothing picked yet'; return; }
    copyText(ids.join(', ')).then((ok) => { $('copied').textContent = ok ? `Copied ${ids.length} ${ids.length === 1 ? 'pick' : 'picks'}` : `${ids.length} picked: ${ids.join(', ')}`; });
  });
  $('copyNotes').addEventListener('click', () => {
    const rows = CAT.filter((r) => (notes[r.id] || '').trim());
    if (!rows.length) { $('copied').textContent = 'No notes yet'; return; }
    const text = rows.map((r) => `${r.id} ${r.element}${picks.has(r.id) ? ' (picked)' : ''}: ${notes[r.id].trim()}`).join('\n');
    copyText(text).then((ok) => { $('copied').textContent = ok ? `Copied notes on ${rows.length} ${rows.length === 1 ? 'chart' : 'charts'}` : 'Could not copy'; });
  });
  const updatePickCount = () => { const n = picks.size; if (!$('copied').textContent.startsWith('Copied')) $('copied').textContent = n ? `${n} picked` : ''; };

  /* cards */
  function card(r, showPage) {
    const c = el('article', 'card' + (r.tier === 'Cut' ? ' cut' : '') + (picks.has(r.id) ? ' picked' : ''));
    c.id = 'card-' + r.id; c.dataset.id = r.id;
    const head = el('header');
    head.appendChild(el('span', 'cid', r.id)); head.appendChild(el('h2', null, r.element));
    if (r.tier === 'Cut') head.appendChild(el('span', 'lab cutlab', 'Cut'));
    if (r.tier === 'Roadmap') head.appendChild(el('span', 'lab', 'Roadmap'));
    if (showPage) head.appendChild(el('span', 'pg', r.page));
    c.appendChild(head);
    c.appendChild(el('p', 'q', r.question));
    const body = el('div', 'body');
    c.appendChild(body);
    const foot = el('footer'), dec = el('p', 'dec');
    dec.appendChild(el('span', null, 'Decision: ')); dec.appendChild(document.createTextNode(r.decision || ''));
    foot.appendChild(dec);
    const lab = el('label', 'pick'), cb = el('input'); cb.type = 'checkbox'; cb.checked = picks.has(r.id);
    cb.addEventListener('change', () => { if (cb.checked) picks.add(r.id); else picks.delete(r.id); c.classList.toggle('picked', cb.checked); savePicks(); $('copied').textContent = ''; updatePickCount(); count(); });
    lab.appendChild(cb); lab.appendChild(document.createTextNode('Pick')); foot.appendChild(lab);
    c.appendChild(foot);
    const nt = el('textarea', 'note'); nt.rows = 1; nt.placeholder = `Notes on ${r.id}`; nt.setAttribute('aria-label', `Notes on ${r.id}`); nt.value = notes[r.id] || '';
    const grow = () => { nt.style.height = 'auto'; nt.style.height = Math.max(nt.scrollHeight, 30) + 'px'; };
    nt.addEventListener('input', () => { if (nt.value.trim()) notes[r.id] = nt.value; else delete notes[r.id]; c.classList.toggle('noted', !!nt.value.trim()); saveNotes(); grow(); });
    c.classList.toggle('noted', !!(notes[r.id] || '').trim());
    c.appendChild(nt); setTimeout(grow, 0);
    const det = el('details'); det.appendChild(el('summary', null, "How it's calculated"));
    const dl = el('dl');
    [['Form', r.form], ['Calculation', r.calc], ['Data', r.data], ['At launch', r.launch], ['Per person', r.perPerson], ['Notes', r.notes], ['Source', r.source], ['Persona', r.persona], ['Tier', r.tier]].forEach(([k, v]) => { if (!v) return; dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); });
    det.appendChild(dl); c.appendChild(det);
    return { c, body };
  }
  function draw(r, body, c) {
    if (!window.DASH || !DASH.has(r.id)) { body.className = 'body missing'; body.textContent = 'Not mocked yet. ' + (r.form ? 'Form: ' + r.form : ''); return 'missing'; }
    const res = DASH.render(r.id, body);
    if (body.dataset.wide === '1') c.classList.add('wide');
    return res;
  }
  function visible() {
    const q = S.q.toLowerCase(), global = !!q || S.picked;
    return CAT.filter((r) => (global || r.page === S.page)
      && (!S.persona || String(r.persona).includes(S.persona))
      && (!S.tier || r.tier === S.tier)
      && (!S.picked || picks.has(r.id) || (notes[r.id] || '').trim())
      && (!q || [r.id, r.element, r.question, r.form, r.calc, r.page, r.decision].join(' ').toLowerCase().includes(q)));
  }
  function count() { const rows = visible(); $('count').textContent = `${rows.length} ${rows.length === 1 ? 'chart' : 'charts'}, ${rows.filter((r) => picks.has(r.id)).length} picked`; }
  function render() {
    const rows = visible(), global = !!S.q || S.picked, box = $('cards');
    box.replaceChildren();
    if (global) { $('title').textContent = S.picked && !S.q ? 'Picked and noted charts' : 'Search results'; $('sub').textContent = S.q ? `Matching "${S.q}" across all pages` : 'Across all pages'; }
    else { $('title').textContent = S.page; $('sub').textContent = info(S.page).question || ''; }
    const results = [];
    rows.forEach((r) => { const { c, body } = card(r, global); box.appendChild(c); results.push({ r, body, res: draw(r, body, c) }); });
    if (!rows.length) box.appendChild(el('p', 'nomatch', 'No charts match. Clear the search or the filters.'));
    count(); updatePickCount();
    return results;
  }

  if (!selftest) {
    render();
    window.addEventListener('hashchange', () => { const before = S.page; readHash(); if (S.page !== before) { $('page').value = S.page; render(); window.scrollTo(0, 0); } });
    return;
  }

  /* self-test: render every page in turn, then report */
  document.body.dataset.mode = 'selftest';
  const out = { total: CAT.length, rendered: 0, missing: [], errors: [], empty: [] };
  for (const p of pages) {
    S.page = p.name; $('page').value = p.name;
    render().forEach(({ r, body, res }) => {
      if (res === 'missing') out.missing.push(r.id);
      else if (res === 'error') out.errors.push({ id: r.id, message: (DASH.errors.filter((e) => e.id === r.id).pop() || {}).message || 'error' });
      else { out.rendered++; if (!body.children.length) out.empty.push(r.id); }
    });
  }
  const json = JSON.stringify(out);
  document.body.dataset.selftest = json;
  $('selftest').textContent = json;
})();
</script>
</body>
</html>
